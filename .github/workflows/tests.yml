name: SQL authentication lab tests

on:
  push:
    paths:
      - "IIT2024045/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "IIT2024045/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  sql-auth-bypass:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IIT2024045
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: IIT2024045/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

