name: Reflected XSS mitigation demo

on:
  push:
    paths:
      - "IIT2024054/**"
      - ".github/workflows/reflected-xss.yml"
  pull_request:
    paths:
      - "IIT2024054/**"
      - ".github/workflows/reflected-xss.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IIT2024054
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: IIT2024054/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
